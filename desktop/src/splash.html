<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Music Scribe</title>
  <style>
    :root {
      --bg0: #12161c;
      --bg1: #1b2430;
      --ink: #f4efe6;
      --muted: #a9b4c2;
      --accent: #3db89a;
      --danger: #e07a5f;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: "Avenir Next", "Segoe UI", Candara, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #2a3a4d 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1f3d36 0%, transparent 50%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      width: min(520px, 100%);
      text-align: center;
    }
    .brand {
      font-size: 2.4rem;
      letter-spacing: 0.02em;
      margin: 0 0 8px;
      font-weight: 700;
    }
    .brand span { color: var(--accent); }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    .wizard {
      width: min(180px, 46vw); height: auto; margin: 0 auto 16px; display: block;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.45));
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .track {
      height: 10px; margin: 18px 8px 8px;
      background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden;
    }
    .track .fill {
      display: block; height: 100%; width: 35%; border-radius: inherit;
      background: linear-gradient(90deg, #c98a17, var(--accent));
      animation: pulse-fill 1.6s ease-in-out infinite;
    }
    @keyframes pulse-fill {
      0%, 100% { width: 28%; }
      50% { width: 72%; }
    }
    #status { font-size: 0.95rem; min-height: 1.4em; }
    #status.error { color: var(--danger); }
    pre {
      text-align: left;
      max-height: 160px;
      overflow: auto;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
      font: 11px/1.4 var(--mono);
      color: #c9d3df;
      display: none;
      margin-top: 16px;
    }
    pre.visible { display: block; }
    button {
      margin-top: 16px;
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      background: var(--accent);
      color: #06231c;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    button.visible { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 class="brand">Music <span>Scribe</span></h1>
      <p>Starting the local engine on this computer. Audio never leaves your machine.</p>
      <img class="wizard" id="wizard" src="assets/wizard-sax.png" alt="">
      <div class="track" id="track" aria-hidden="true"><i class="fill"></i></div>
      <div id="status">Starting engine…</div>
      <button id="retry">Try again</button>
      <pre id="log"></pre>
    </div>
  </main>
  <script>
    const status = document.getElementById("status");
    const logEl = document.getElementById("log");
    const retry = document.getElementById("retry");
    const track = document.getElementById("track");

    function showError(message) {
      track.style.display = "none";
      status.classList.add("error");
      status.textContent = message;
      retry.classList.add("visible");
      logEl.classList.add("visible");
    }

    window.musicScribeDesktop.onHelperLog((line) => {
      logEl.textContent += line + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    });

    async function boot() {
      try {
        const state = await window.musicScribeDesktop.getState();
        if (state.error) {
          showError(state.error);
          return;
        }
        status.textContent = state.modelsReady
          ? "Engine ready — opening Music Scribe…"
          : "Engine ready — checking AI models…";
        await window.musicScribeDesktop.openApp();
      } catch (err) {
        showError(err.message || String(err));
      }
    }

    retry.onclick = async () => {
      retry.classList.remove("visible");
      status.classList.remove("error");
      status.textContent = "Restarting engine…";
      track.style.display = "block";
      logEl.textContent = "";
      try {
        await window.musicScribeDesktop.retryHelper();
        await boot();
      } catch (err) {
        showError(err.message || String(err));
      }
    };

    boot();
  </script>
</body>
</html>
