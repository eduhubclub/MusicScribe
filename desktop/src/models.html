<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Music Scribe — Download models</title>
  <style>
    :root {
      --bg0: #12161c;
      --bg1: #1b2430;
      --ink: #f4efe6;
      --muted: #a9b4c2;
      --accent: #3db89a;
      --danger: #e07a5f;
      --sans: "Avenir Next", "Segoe UI", Candara, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1000px 500px at 0% 0%, #243246 0%, transparent 55%),
        linear-gradient(165deg, var(--bg0), var(--bg1));
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    .panel {
      width: min(560px, 100%);
    }
    h1 { margin: 0 0 8px; font-size: 1.9rem; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.5; }
    ul { padding-left: 1.1rem; color: var(--muted); }
    .bar {
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 18px 0 10px;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2f9e83, var(--accent));
      transition: width 0.35s ease;
    }
    #message { min-height: 1.4em; }
    #message.error { color: var(--danger); }
    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      background: var(--accent);
      color: #06231c;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    .meta { font-size: 0.85rem; opacity: 0.85; margin-top: 18px; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>Music <span>Scribe</span></h1>
      <p>
        One-time download of the local AI models (Demucs + Whisper).
        They stay in your Music Scribe folder — the installer stays lean, and songs never leave this computer.
      </p>
      <ul id="checklist"></ul>
      <div class="bar"><i id="fill"></i></div>
      <div id="message">Checking local cache…</div>
      <button id="action">Download models</button>
      <p class="meta" id="cachePath"></p>
    </div>
  </main>
  <script>
    const checklist = document.getElementById("checklist");
    const fill = document.getElementById("fill");
    const message = document.getElementById("message");
    const action = document.getElementById("action");
    const cachePath = document.getElementById("cachePath");
    let polling = null;

    function renderModels(models) {
      const items = [
        ["Demucs (" + models.demucs.name + ")", models.demucs.ready],
        ["Whisper (" + models.whisper.name + ")", models.whisper.ready],
        ["Basic Pitch (bundled)", models.basic_pitch.ready],
      ];
      checklist.innerHTML = items.map(([label, ok]) =>
        `<li>${ok ? "✓" : "○"} ${label}</li>`
      ).join("");
      cachePath.innerHTML = `Cache: <code>${models.cache_dir}</code>`;
    }

    async function refresh() {
      const snap = await window.musicScribeDesktop.getModelStatus();
      if (snap.models) renderModels(snap.models);
      const pct = Math.round((snap.progress || 0) * 100);
      fill.style.width = pct + "%";
      if (snap.status === "error") {
        message.classList.add("error");
        message.textContent = snap.error || snap.message || "Download failed";
        action.disabled = false;
        action.textContent = "Retry download";
        clearInterval(polling);
        polling = null;
        return false;
      }
      message.classList.remove("error");
      message.textContent = snap.message || (snap.models && snap.models.ready ? "Models ready" : "Waiting…");
      if (snap.models && snap.models.ready) {
        action.disabled = true;
        action.textContent = "Opening…";
        clearInterval(polling);
        polling = null;
        await window.musicScribeDesktop.openApp();
        return true;
      }
      return false;
    }

    action.onclick = async () => {
      action.disabled = true;
      action.textContent = "Downloading…";
      message.classList.remove("error");
      await window.musicScribeDesktop.startModelDownload();
      if (!polling) polling = setInterval(refresh, 800);
      await refresh();
    };

    (async () => {
      const ready = await refresh();
      if (ready) return;
      // Auto-start download on first run.
      action.click();
    })();
  </script>
</body>
</html>
